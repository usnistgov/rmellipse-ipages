name: Nightly Build
on:
  schedule:
    # Run the workflow every night at 2 AM UTC
    - cron: '0 2 * * *'
  # Allows manual triggering from the GitHub Actions tab (optional)
  workflow_dispatch:
jobs:
  update-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to avoid push errors
          fetch-depth: 0
          # Use a PAT if you want this commit to trigger other workflows
          # token: ${{ secrets.MY_PAT }}

      - name: Build
        run: |
          make clean
          make